<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>web_brain</title>
<style>
:root{--bg:#fff;--fg:#0b0b0c;--mute:#6e6e73;--line:#e7e7e9;--acc:#ff4b2b}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--fg:#f4f4f5;--mute:#9a9aa0;--line:#232326}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.35 "Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Segoe UI",sans-serif;text-rendering:optimizeLegibility;padding-bottom:78px}
main{max-width:480px;margin:0 auto;padding:22px 22px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.02em}
.lab{font-size:12px;text-transform:uppercase;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:34px}
.top b{font-size:13px}
/* gấp */
.urg{display:flex;gap:16px;align-items:flex-start;padding:18px 18px 8px;border:1.5px solid var(--acc);border-radius:18px;margin-bottom:6px}
.urg .n{font-size:64px;line-height:.9;font-weight:700;color:var(--acc);letter-spacing:-.04em}
.urg ul{list-style:none;margin:6px 0 0;padding:0;font-size:17px;font-weight:600}
.urg li{margin-bottom:12px;line-height:1.2}
.urg li .w{display:block;margin-top:3px;font-size:12px;font-weight:400;color:var(--mute)}
/* tiếp theo */
.next{padding:26px 0;border-bottom:1px solid var(--line)}
.next .t{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1.1}
.next .t i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--acc);margin-right:10px;vertical-align:middle;transform:translateY(-3px)}
.next .s{color:var(--mute);margin-top:6px}
/* bộ chọn */
.seg{display:flex;gap:6px;margin:22px 0 6px}
.seg button{font:inherit;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:none;color:var(--mute);padding:7px 12px;border-radius:999px;white-space:nowrap}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button em{font-style:normal;opacity:.6;margin-left:6px}
.seg button.now:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:middle;transform:translateY(-1px)}
/* dải ngày */
.day{display:flex;gap:3px;position:relative;height:5px;margin:22px 0 0}
.day span{display:block;border-radius:3px;background:var(--line)}
.day span.on{background:var(--fg)}
.day i{position:absolute;top:-5px;width:3px;height:15px;margin-left:-1.5px;border-radius:2px;background:var(--acc)}
.dayl{display:flex;gap:3px;margin-top:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
/* danh sách */
.row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.row .c{width:24px;height:24px;border:1.5px solid var(--fg);border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;background:none;color:var(--bg);padding:0}
.row .t{flex:1;font-weight:600}.row .d{font-size:13px;color:var(--mute)}
.row.done .c{background:var(--fg)}.row.done .t{color:var(--mute);text-decoration:line-through;font-weight:400}
/* tuần */
.week{display:flex;justify-content:space-between;align-items:flex-end;height:70px;margin:8px 0 4px}
.week div{width:30px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.week i{display:block;width:100%;background:var(--fg);border-radius:2px}
.week .today{color:var(--fg);font-weight:700}
h2{margin:34px 0 8px}
.dl{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dl b{font-size:15px;white-space:nowrap}.dl.hot b{color:var(--acc)}
.dl.hot span{font-weight:700}.dl.wk b{font-weight:700}.dl.far span,.dl.far b{color:var(--mute)}
.dlw .x{display:none}.dlw.open .x{display:flex}.dlw.open h2.x{display:block}
.dg{margin:20px 0 2px}
.more{margin-top:12px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--mute);font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;cursor:pointer}
/* các trang khác */
.big{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:10px}
.thin{height:3px;background:var(--line);margin-top:10px}.thin i{display:block;height:100%;background:var(--fg)}
.tl{border-left:1px solid var(--fg);margin-left:4px;padding-left:20px}
.tl div{margin-bottom:26px;position:relative}
.tl div:before{content:"";position:absolute;left:-26px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--fg)}
.tl div.now:before{background:var(--acc);border-color:var(--acc)}
.tl .w{font-size:20px;font-weight:600;margin-top:2px}
.goal{padding:20px 0;border-bottom:1px solid var(--line)}
.goal .g{font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between}
section{display:none}section.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:14px 0 calc(14px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:4px 8px}
nav button.on{color:var(--fg);font-weight:700;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.foot{margin-top:30px;text-align:center;font-size:11px;color:var(--mute)}

#cv{display:block;width:100%;touch-action:none;margin:6px auto 0;background:#0b0b0c;border-radius:20px}
.hint{text-align:center;margin-top:6px}
.ai{padding:22px 0;border-bottom:1px solid var(--line)}
.ai.over .big{color:var(--acc)}
.gauge{position:relative;height:3px;background:var(--line);margin:14px 0 6px}
.gauge i{display:block;height:100%;background:var(--fg)}
.ai.over .gauge i{background:var(--acc)}
.gauge u{position:absolute;top:-7px;width:2px;height:17px;background:var(--fg);text-decoration:none}
.range{width:100%;accent-color:var(--fg);margin:10px 0 0}
.dl.link{cursor:pointer}
nav button{padding:4px 5px}

.prof{margin:-14px 0 28px}
.ban{height:120px;border-radius:18px;background-size:cover;background-position:50% 64%;background-repeat:no-repeat}
.ban.ph{display:grid;place-items:center;border:1.5px solid var(--fg);font-size:22px}
.tg{margin-top:14px}
.tg{font-weight:600;line-height:1.25;font-size:18px}
.tags{font-size:11px;color:var(--mute);margin-top:7px;letter-spacing:.06em;text-transform:uppercase}

#slot{display:none}
.g{display:block}
#mu{margin-left:auto;margin-right:14px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;width:30px;height:30px;font-size:15px;padding:0}
#mu.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#mubox{margin:-14px 0 20px}#mubox iframe{display:block;width:260px;height:146px;border:0;border-radius:12px}
@media (min-width:900px){
 body{display:flex;flex-direction:column;padding-bottom:30px}
 nav{order:-1;position:static;border:0;border-bottom:1px solid var(--line);gap:34px;padding:16px 0;justify-content:center}
 .fam nav button[data-t=brain]{display:none}
 main{max-width:1120px;width:100%;padding:22px 32px}
 section:not(#home){max-width:900px;margin:0 auto}
 section#ai{max-width:560px}
 .seg .dn{display:block}
 #brain .hint{display:none}
 .pg{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
 .cg{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;align-items:start}
 .g{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:40px;align-items:start}
 .mo .mr{flex-direction:column;align-items:flex-start;gap:3px}.mo .mr span{font-weight:600}
 .prof{margin-top:0}
 .ban{height:170px}
 #slot{display:block;margin:0 0 28px}
 #mubox{position:fixed;right:24px;bottom:24px;z-index:50;margin:0;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
}

#splash{position:fixed;inset:0;z-index:99;background:#0b0b0c;color:#f4f4f5;display:grid;place-items:center;text-align:center;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
.sp-dot{width:10px;height:10px;border-radius:50%;background:var(--acc);margin:0 auto 26px;animation:pu 1.6s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(255,75,43,.55)}100%{box-shadow:0 0 0 24px rgba(255,75,43,0)}}
.sp-t{font-size:46px;letter-spacing:.32em;font-weight:700;margin-right:-.32em}
.sp-s{margin-top:20px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#8a8a8e}
.sp-d{margin-top:8px;font-size:12px;color:#5f5f64}
#splash button{margin-top:40px;background:none;border:0;color:#6b6b70;font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:10px}

.wide{display:none}
.mr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mr b{font-size:13px;color:var(--mute);font-weight:400;white-space:nowrap}
.qn{width:100%;font:inherit;font-size:14px;padding:12px 0;border:0;border-bottom:1.5px solid var(--fg);background:none;color:var(--fg);outline:none;border-radius:0}
.qx{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:0 4px}
@media (min-width:900px){
 .wide{display:block}
 .wide.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:26px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
 .stats b{display:block;font-size:38px;letter-spacing:-.03em;line-height:1;font-weight:700}
 .stats span{display:block;margin-top:8px}
}
/* các tab, công ty AI */
.seg .dn{display:none;margin-left:auto;align-self:center;font-size:12px;color:var(--mute)}
.pg>div>h2:first-child{margin-top:0}
.cg h2{margin-top:20px}
.co .sl{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:4px 0 6px}
.stf{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stf b{font-weight:700}.stf span{color:var(--mute)}
.rul{counter-reset:r}
.rul div{counter-increment:r;position:relative;padding:11px 0 11px 30px;border-bottom:1px solid var(--line);font-weight:600}
.rul div:before{content:counter(r);position:absolute;left:0;top:13px;font:700 12px ui-monospace,Menlo,monospace;color:var(--acc)}
.wkr{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.wkr b{font-size:12px;color:var(--mute)}.wkr em{font-style:normal;font-size:12px;color:var(--mute)}
.wkr.today b{color:var(--acc)}.wkr.today span{font-weight:700}
.tk{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tk i{display:grid;place-items:center;min-width:64px;padding:7px 0;border:1.5px solid var(--fg);border-radius:999px;font-style:normal;font-size:12px}
.tk i.ok{background:var(--fg);color:var(--bg)}
/* lĩnh vực: chấm màu + hàng lọc thứ hai */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;transform:translateY(-1px)}
.seg.ar{flex-wrap:wrap;margin-top:8px}.seg.ar button{font-size:11px;padding:5px 10px}
@media (max-width:899px){nav button{font-size:10px;letter-spacing:.03em;padding:4px 3px}}
.top .rt{display:flex;align-items:center;gap:12px}
.lg{display:inline-flex;gap:1px}.lg button{font:inherit;font-size:11px;letter-spacing:.06em;border:0;background:none;color:var(--mute);padding:3px 7px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.lg button:hover{color:var(--fg)}.lg button.on{background:var(--fg);color:var(--bg)}
/* mã truy cập (KEY) */
.kb{font:inherit;font-size:11px;letter-spacing:.04em;border:1px solid var(--line);background:none;color:var(--mute);padding:3px 9px;border-radius:999px;cursor:pointer;transition:color .15s,border-color .15s}
.kb:hover{color:var(--fg);border-color:var(--fg)}.kb.on{color:var(--fg);border-color:var(--fg)}
#kd{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;animation:fade .2s}
.kc{background:var(--bg);color:var(--fg);border-radius:16px;padding:22px;max-width:380px;width:100%}
.kt{font-weight:700;font-size:18px;margin-bottom:12px}
#kin{width:100%;font:inherit;padding:12px;border:1.5px solid var(--fg);border-radius:10px;background:none;color:var(--fg)}
.kmsg{min-height:20px;margin-top:8px;font-size:13px;color:var(--acc)}
.ka{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.kbtn{font:inherit;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}
.kbtn.kp{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* tổng thể: vào trang nhẹ, phản hồi khi chạm, khoảng thở, tiêu điểm bàn phím — tất cả tắt khi máy đặt "giảm chuyển động" */
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.g>div>*{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
.g>div>*:nth-child(2){animation-delay:.04s}.g>div>*:nth-child(3){animation-delay:.08s}.g>div>*:nth-child(4){animation-delay:.12s}.g>div>*:nth-child(5){animation-delay:.16s}.g>div>*:nth-child(n+6){animation-delay:.2s}
section.on:not(#home){animation:fade .28s ease}
.sit{margin-bottom:14px}
.seg.ar button:not(.on){border-color:transparent;background:rgba(127,127,127,.09)}
.seg button,.row,.dl,nav button,.more{transition:background .15s,color .15s,border-color .15s,transform .12s}
.seg button:active,.more:active{transform:scale(.96)}.row:active .c{transform:scale(.88)}
.row .c{transition:background .15s,transform .12s}
@media (hover:hover){.row:hover{background:rgba(127,127,127,.06)}.seg button:not(.on):hover{color:var(--fg)}}
button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* khoẻ: dải ngồi + mức đau */
.sit{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.sit.hot{border:1.5px solid var(--acc)}.sit.hot .sm{color:var(--acc);font-weight:700}
.sit .sm{font-weight:600;line-height:1.25}.sit .sp{margin-top:4px;font-size:12px;color:var(--mute);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sit button{flex:none;font:inherit;font-size:12px;letter-spacing:.04em;border:1px solid var(--fg);background:none;color:var(--fg);border-radius:999px;padding:8px 12px;cursor:pointer}
.pn{display:flex;gap:4px;margin:6px 0 14px}.pn button{flex:1;font:inherit;font-size:13px;padding:8px 0;border:1px solid var(--line);background:none;color:var(--mute);border-radius:8px;cursor:pointer}
.pn button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rul.tp div{font-weight:400}
/* thời tiết 7 ngày: icon nét mảnh, mưa ≥60% đổi màu nhấn */
.wx{margin:26px 0 0}
.wxg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wxg div{padding:8px 0;font-size:11px;color:var(--mute)}
.wxg div.today{color:var(--fg);font-weight:700}
.wxg div.wet{color:var(--acc)}
.wxg svg{display:block;margin:0 auto 5px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wxg .p{display:block;height:12px;margin-top:3px;font-size:10px}
/* chuyển động tiết chế: chỉ hôm nay + ngày mưa ≥60%, chậm và nhỏ; tắt khi máy đặt "giảm chuyển động" */
.wxg .today .rays{transform-origin:12px 12px;animation:wxspin 16s linear infinite}
.wxg .today .cl,.wxg .wet .cl{animation:wxdrift 4s ease-in-out infinite alternate}
.wxg .today .dr,.wxg .wet .dr{animation:wxfall 1.5s linear infinite}
.wxg .dr2{animation-delay:.5s!important}.wxg .dr3{animation-delay:1s!important}
.wxg .today .bolt,.wxg .wet .bolt{animation:wxflash 2.6s steps(1) infinite}
@keyframes wxspin{to{transform:rotate(360deg)}}
@keyframes wxdrift{from{transform:translateX(-1px)}to{transform:translateX(1px)}}
@keyframes wxfall{0%{transform:translateY(-1.5px);opacity:0}30%{opacity:1}100%{transform:translateY(2px);opacity:0}}
@keyframes wxflash{0%,70%,100%{opacity:1}78%{opacity:.15}86%{opacity:1}92%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.wxg *{animation:none!important}}
.wxn{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
/* Gmail quan trọng: thẻ riêng (chỉ có khi real.json có "mail") */
.ml{margin:14px 0 0;padding:14px 16px 6px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(127,127,127,.06),rgba(127,127,127,0) 55%)}
.ml .mh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ml .mic{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ml .mh b{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
.ml .mrf{background:none;border:0;color:var(--mute);font-size:16px;line-height:1;cursor:pointer;padding:2px 2px 2px 6px;transition:color .15s}
.ml .mrf:hover{color:var(--fg)}.ml .mrf.spin{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ml .mi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);max-height:110px;overflow:hidden;animation:up .38s cubic-bezier(.2,.7,.2,1) both;transition:opacity .2s,transform .22s,max-height .26s .06s,padding .26s .06s,border-color .26s .06s}
.ml .mi.out{opacity:0;transform:translateX(18px);max-height:0;padding-top:0;padding-bottom:0;border-color:transparent}
.ml .md{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 3px rgba(127,127,127,.12)}
.ml .mt{color:inherit;text-decoration:none;min-width:0}
.ml .mg{display:block;font-size:11px;color:var(--mute)}
.ml .ms{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.25}
.ml .mi.nw .ms:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:7px;transform:translateY(-1px)}
.ml .act{display:flex;align-items:center;gap:8px;flex:none}
.ml .go{font-size:12px;color:var(--mute);text-decoration:none;transition:color .15s}.ml .go:hover,.ml .mt:hover+.act .go{color:var(--fg)}
.ml .mx{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);font-size:15px;line-height:1;cursor:pointer;padding:0;transition:color .15s,border-color .15s,background .15s}
.ml .mx:hover{color:var(--bg);background:var(--fg);border-color:var(--fg)}
@media (hover:hover){.ml .mx{opacity:.35}.ml .mi:hover .mx{opacity:1}}
.ml .nt{margin:0;padding:8px 0 12px;display:flex;align-items:center;gap:8px}
.ml .nt svg{width:15px;height:15px;stroke:var(--mute);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ml .mht{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--mute);font-size:12px;padding:10px 0;cursor:pointer}
.ml .mht:hover{color:var(--fg)}
.ml .mi.hid{opacity:.55}.ml .mi.hid .ms{font-weight:400}
.ml .mrs{background:none;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:11px;padding:5px 10px;cursor:pointer;transition:color .15s,border-color .15s}
.ml .mrs:hover{color:var(--fg);border-color:var(--fg)}
.nt{font-size:12px;color:var(--mute);margin-top:8px}
/* một màn hình, không cuộn (máy tính rộng) */
@media (min-width:1180px){
 nav{padding:12px 0}

<body>

<nav id="nav" class="mono"></nav>

<script>
var FAM=/[?&]v=nha/.test(location.search);
var DATA=null,st={},used=40,f="all",fa="all",hot={},TABS=[];
/* lĩnh vực: khoá → [tên hiển thị, màu hue]. Đổi tên chỉ cần sửa ở đây. */
var AR={work:["Việc chính",210],biz:["Tay trái",30],home:["Tổ ấm",140],learn:["Học",270],fit:["Khoẻ",175]};
/* nhóm = tab = điểm trên quả cầu; AR vẫn là màu chi tiết từng lĩnh vực */
var GR={earn:["Kiếm cơm",["work","biz"]],home:["Tổ ấm",["home"]],grow:["Rèn",["learn","fit"]]};
function inG(g,a){return g==="all"||(GR[g]&&GR[g][1].indexOf(a)>=0)}
function dotH(a){return AR[a]?'<i class="dot" style="background:hsl('+AR[a][1]+',70%,55%)"></i>':""}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ls(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function vis(x){return !FAM||x.scope==="family"}
var APIURL="";
function getJ(u,ms){var c=new AbortController(),t=setTimeout(function(){c.abort()},ms||9000);
  return fetch(u,{cache:"no-store",signal:c.signal}).then(function(r){clearTimeout(t);if(!r.ok)throw 0;return r.json()},function(e){clearTimeout(t);throw e})}
/* trộn dữ liệu cuộc sống từ Brain API lên bản nền (real.json trên máy, hoặc demo.json trên bản công khai) */
function mergeApi(b,j){var d=JSON.parse(JSON.stringify(b));
  ["deadlines","tasks","urgent","timeline","docs","workweek","goals","notes","pain"].forEach(function(k){if(j[k]!==undefined)d[k]=j[k]});
  d.learn=d.learn||{};if(j.learn&&j.learn.week)d.learn.week=j.learn.week;
  if(j.updated)d.updated=String(j.updated).replace(" ","T");
  d.label="Dữ liệu thật";d.__role=j.role;d.__live=true;return d}
function load(){
  var base=null,key=ls("wb_key","");
  return getJ("data/real.json").then(function(r){base=r},function(){}).then(function(){return base?0:getJ("data/demo.json").then(function(r){base=r})})
    .then(function(){return getJ("data/config.json").catch(function(){return{}})})
    .then(function(cfg){
      var ba=base.brain_api||{};APIURL=ba.url||cfg.api||"";key=key||ba.key||"";
      if(!APIURL||!key)return base;
      return getJ(APIURL+"?k="+encodeURIComponent(key),12000).then(function(j){
        if(j.error){if(ls("wb_key","")){lset("wb_key","");lset("wb_api",null)}throw 0}
        lset("wb_api",{t:Date.now(),d:j});return mergeApi(base,j)
      }).catch(function(){var c=ls("wb_api",null);return(c&&c.d&&ls("wb_key",""))?mergeApi(base,c.d):base})})}
function kbHtml(){if(!APIURL)return"";return DATA&&DATA.__live?'<button class="kb on" id="kb" title="Thoát">'+(DATA.__role==="family"?"Gia đình ✓":"Dữ liệu thật ✓")+'</button>':'<button class="kb" id="kb">Nhập mã</button>'}
function keyDlg(live){
  var o=document.createElement("div");o.id="kd";
  o.innerHTML='<div class="kc">'+(live?'<div class="kt">Thoát chế độ dữ liệu thật?</div><div class="ka"><button class="kbtn" id="kno">Huỷ</button><button class="kbtn kp" id="kout">Thoát</button></div>'
    :'<div class="kt">Nhập mã truy cập</div><input id="kin" type="password" autocomplete="off" placeholder="Dán mã do Thành gửi"><div class="kmsg" id="kmsg"></div><div class="ka"><button class="kbtn" id="kno">Huỷ</button><button class="kbtn kp" id="kgo">Mở</button></div>')+'</div>';
  document.body.appendChild(o);var $=function(i){return document.getElementById(i)};
  $("kno").onclick=function(){o.remove()};o.onclick=function(e){if(e.target===o)o.remove()};
  if(live){$("kout").onclick=function(){lset("wb_key","");lset("wb_api",null);location.reload()};return}
  var go=function(){var k=$("kin").value.trim();if(!k)return;$("kmsg").textContent="Đang kiểm tra…";
    getJ(APIURL+"?k="+encodeURIComponent(k),12000).then(function(j){if(j.error){$("kmsg").textContent="Mã không đúng";return}lset("wb_key",k);location.reload()},function(){$("kmsg").textContent="Không kết nối được"})};
  $("kgo").onclick=go;$("kin").onkeydown=function(e){if(e.key==="Enter")go()};setTimeout(function(){$("kin").focus()},50)}
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("#kb"))keyDlg(!!(DATA&&DATA.__live))});
(function(){var m=/[#&]k=([0-9a-fA-F]{20,})/.exec(location.hash);if(m){lset("wb_key",m[1]);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}})();
function today(){var d=new Date(),n=["CN","T2","T3","T4","T5","T6","T7"],m=d.getDate()+"."+(d.getMonth()+1);return n[d.getDay()]+" · "+m}
function head(l){var u=DATA&&DATA.updated?new Date(DATA.updated):null;return '<div class="top mono"><span class="lab">'+l+'</span><span class="rt"><b>'+(u?'cập nhật '+u.getDate()+'.'+(u.getMonth()+1):'BRAIN')+'</b>'+kbHtml()+lgHtml()+'</span></div>'}
function days(x){if(x.in!=null)return x.in;var p=String(x.date).split("-"),a=new Date(+p[0],+p[1]-1,+p[2]),n=new Date(),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((a-b)/864e5)}

function slotNow(){var d=new Date(),m=d.getHours()*60+d.getMinutes();return m>=300&&m<690?"morning":(m>=690&&m<1260?"train":"night")}
function dayStrip(){var d=new Date(),m=d.getHours()*60+d.getMinutes(),r=(m-360)/1200;if(m<360)r=m<120?(m+1080)/1200:0;r=Math.max(0,Math.min(1,r));var s=slotNow();return '<div class="day"><span style="flex:27.5" class="'+(s==="morning"?"on":"")+'"></span><span style="flex:47.5" class="'+(s==="train"?"on":"")+'"></span><span style="flex:25" class="'+(s==="night"?"on":"")+'"></span><i style="left:'+(r*100)+'%"></i></div><div class="dayl mono"><span style="flex:27.5">Sáng</span><span style="flex:47.5">Tàu</span><span style="flex:25">Khuya</span></div>'}
function segHtml(){var T=(DATA.tasks||[]).filter(vis),s=slotNow(),L=[["all","Tất cả"],["morning","Sáng"],["train","Tàu"],["night","Khuya"]];return '<div class="seg mono" id="seg">'+L.map(function(a){var n=a[0]==="all"?T.length:T.filter(function(x){return x.c===a[0]}).length,c=(a[0]===f?"on ":"")+(a[0]===s?"now":"");return '<button'+(c.trim()?' class="'+c.trim()+'"':'')+' data-c="'+a[0]+'">'+a[1]+'<em>'+n+'</em></button>'}).join("")+'<span class="dn mono" id="sd">0/'+T.length+'</span></div>'}
function arHtml(){var T=(DATA.tasks||[]).filter(vis),L=[["all","Tất cả"]].concat(Object.keys(GR).map(function(k){return[k,GR[k][0]]}));return '<div class="seg ar mono" id="segA">'+L.map(function(a){var n=a[0]==="all"?T.length:T.filter(function(x){return inG(a[0],x.a)}).length;return n||a[0]==="all"?'<button'+(a[0]===fa?' class="on"':'')+' data-a="'+a[0]+'">'+(a[0]==="all"?"":GR[a[0]][1].map(dotH).join(""))+a[1]+'<em>'+n+'</em></button>':""}).join("")+'</div>'}
function renderHome(){
  var hd=head(today()),p1="",p2="",p2b="",p3="";
  var pr=DATA.profile;
  if(pr){p1+='<div class="prof">'+(pr.avatar?'<div class="ban" style="background-image:url('+esc(pr.avatar)+')"></div>':'<div class="ban ph mono">WB</div>')+'<div class="tg">'+esc(pr.tagline||"")+'</div><div class="tags mono">'+(pr.tags||[]).map(esc).join(" · ")+'</div></div>'}
  var u=(DATA.urgent||[]),ug="";
  if(!FAM){
    ug=u.length?'<div class="urg"><div class="n mono">'+u.length+'</div><div><span class="lab mono">Cháy rồi</span><ul>'+u.map(function(x){return'<li>'+esc(x.t||x)+(x.when?'<span class="w mono">'+esc(x.when)+'</span>':'')+'</li>'}).join("")+'</ul></div></div>'
      :'<div class="urg"><div class="n mono" style="color:var(--mute)">0</div><div><span class="lab mono">Cháy rồi</span><ul><li>Yên bình. Đáng ngờ.</li></ul></div></div>';
  }
  if(!FAM&&DATA.updated){var ag=Math.floor((new Date()-new Date(DATA.updated))/864e5);if(ag>=2)p1+='<div><h2 class="lab mono">Cần cập nhật</h2><div class="mr"><span>'+ag+' ngày rồi chưa kể tao nghe lịch. Tao sắp quên mày.</span></div></div>'}
  var tl=(DATA.timeline||[]).filter(vis).slice(0,2);
  if(tl.length)p1+='<div class="wide mo"><h2 class="lab mono">Mốc sắp tới</h2>'+tl.map(function(x){return'<div class="mr"><span>'+esc(x.what)+'</span><b class="mono">'+esc(x.when)+'</b></div>'}).join("")+'</div>';
  p1+='<div class="wx" id="wx"></div>';
  p2+=ug+(FAM||!(DATA.mail&&DATA.mail.url)?"":'<div class="ml" id="ml"></div>')+'<div class="next"><span class="lab mono">Làm gì giờ?</span><div class="t" id="nx"></div><div class="s mono" id="ns"></div>'+dayStrip()+'</div>'+(FAM?"":sitHtml());
  p2b+=segHtml()+arHtml()+'<div id="tasks"></div><div class="nt">Tick tự reset lúc 0:00</div>';
  if(!FAM)p1+='<div class="wide"><h2 class="lab mono">Thả ý tưởng</h2><input id="qn" class="qn mono" placeholder="Gõ ý tưởng, Enter là xong" autocomplete="off"><div id="qnl"></div></div>';
  if(!FAM&&DATA.week)p3+='<h2 class="lab mono">Tuần</h2><div class="week" id="week"></div>';
  var dl=(DATA.deadlines||[]).filter(vis).filter(function(x){return !x.hide}).map(function(x){return{t:x.t,n:days(x),a:x.a}}).filter(function(x){return x.n>=0}).sort(function(a,b){return a.n-b.n});
  if(dl.length){var gh=function(n){return n<=1?"Hôm nay · ngày mai":(n<=7?"Tuần này":"Sau đó")},lg="",k=0,hh="";
    dl.forEach(function(x){var g=gh(x.n),xc=k>=5?" x":"";if(g!==lg){hh+='<h2 class="lab mono dg'+xc+'">'+g+'</h2>';lg=g}hh+='<div class="dl'+(x.n<=1?' hot':(x.n<=7?' wk':' far'))+xc+'"><span>'+dotH(x.a)+esc(x.t)+'</span><b class="mono">'+(x.n===0?"hôm nay":(x.n===1?"ngày mai":x.n+" ngày"))+'</b></div>';k++});
    p3+='<h2 class="lab mono">Sắp tới hạn</h2><div class="dlw" id="dlw">'+hh+(dl.length>5?'<button class="more mono" id="more" data-n="'+(dl.length-5)+'">Xem thêm +'+(dl.length-5)+'</button>':'')+'</div>'}
  document.getElementById("home").innerHTML=hd+'<div class="g"><div class="c1">'+p1+'</div><div class="c2">'+p2+p2b+'</div><div class="c3"><div id="slot"></div>'+p3+'</div></div>';
  var tb=document.querySelector("#home .top b");if(tb&&!FAM){tb.textContent+=" · AI "+used+"%";tb.style.cursor="pointer";tb.onclick=function(){go("ai")}}
  var mo=document.getElementById("more");if(mo)mo.onclick=function(){var w=document.getElementById("dlw");w.classList.toggle("open");this.textContent=w.classList.contains("open")?"Thu gọn":"Xem thêm +"+this.dataset.n};
  if(DATA.music&&DATA.music.url){var mm=/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/.exec(DATA.music.url);if(mm){var tp=document.querySelector("#home .top"),mb=document.createElement("button");mb.id="mu";mb.className="mono";mb.textContent="\u266a";tp.insertBefore(mb,tp.lastElementChild);var bx=document.createElement("div");bx.id="mubox";tp.parentNode.insertBefore(bx,tp.nextSibling);var ifr=function(){return '<iframe src="https://www.youtube.com/embed/'+mm[1]+'?autoplay=1&loop=1&playlist='+mm[1]+'&playsinline=1&start='+(DATA.music.start||0)+'" allow="autoplay; encrypted-media" allowfullscreen></iframe>'};
function mOn(){bx.innerHTML=ifr();mb.classList.add("on");lset("wb_mu","on")}
function mOff(){bx.innerHTML="";mb.classList.remove("on");lset("wb_mu","off")}
mb.onclick=function(){if(bx.firstChild)mOff();else mOn()};
window.mPlay=mOn;
}}
  if(!FAM&&DATA.week){var D=["T2","T3","T4","T5","T6","T7","CN"],w="",di=(new Date().getDay()+6)%7;
    D.forEach(function(d,i){var v=DATA.week[i]||0;w+='<div class="'+(i===di?'today':'')+'"><i style="height:'+Math.max(v*.5,3)+'px;opacity:'+(v?1:.15)+'"></i>'+d+'</div>'});
    document.getElementById("week").innerHTML=w}
  var qn=document.getElementById("qn");
  if(qn){var qs=ls("wb_qn",[]);var qr=function(){document.getElementById("qnl").innerHTML=qs.map(function(t,i){return'<div class="mr"><span>'+esc(t)+'</span><button class="qx" data-i="'+i+'">×</button></div>'}).join("")};qr();
    qn.onkeydown=function(e){if(e.key==="Enter"&&this.value.trim()){qs.unshift(this.value.trim());lset("wb_qn",qs);this.value="";qr()}};
    document.getElementById("qnl").onclick=function(e){var b=e.target.closest(".qx");if(!b)return;qs.splice(+b.dataset.i,1);lset("wb_qn",qs);qr()}}
  var seg=document.getElementById("seg");
  seg.onclick=function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call(seg.children,function(x){x.classList.remove("on")});b.classList.add("on");f=b.dataset.c;draw()};
  var sga=document.getElementById("segA");
  sga.onclick=function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call(sga.children,function(x){x.classList.remove("on")});b.classList.add("on");fa=b.dataset.a;draw()};
  document.getElementById("tasks").onclick=function(e){var r=e.target.closest(".row");if(!r)return;dayRoll();st[r.dataset.id]=!st[r.dataset.id];lset("wb_st",st);draw()};
  wxInit();mailInit();
  var sitEl=document.getElementById("sit");
  if(sitEl){sitEl.onclick=function(e){if(e.target.closest("#sb")){lset("wb_sit",Date.now());sitTick()}else if(e.target.id==="sp")go("learn")};sitTick();setInterval(sitTick,30000)}
  var ar=document.getElementById("aiRow");if(ar)ar.onclick=function(){go("ai")};
}
function dayRoll(){if(ls("wb_std","")!==dayKey()){st={};lset("wb_st",st);lset("wb_std",dayKey())}}
function midnight(){var n=new Date(),ms=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,2)-n;setTimeout(function(){dayRoll();draw();renderOthers();midnight()},ms)}
function dayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function draw(){
  dayRoll();
  var T=(DATA.tasks||[]).filter(vis),Ta=T.filter(function(x){return inG(fa,x.a)}),list=Ta.filter(function(x){return f==="all"||x.c===f}),h="";
  list=list.filter(function(x){return !st[x.id]}).concat(list.filter(function(x){return st[x.id]}));
  list.forEach(function(x){h+='<div class="row'+(st[x.id]?' done':'')+'" data-id="'+esc(x.id)+'"><button class="c">'+(st[x.id]?'✓':'')+'</button><div class="t">'+dotH(x.a)+esc(x.t)+'</div><span class="d mono">'+esc(x.d||"")+'</span></div>'});
  if(!list.length)h='<div class="row"><div class="t" style="color:var(--mute);font-weight:400">Chưa có việc</div></div>';
  document.getElementById("tasks").innerHTML=h;
  var sdEl=document.getElementById("sd");if(sdEl)sdEl.textContent=T.filter(function(x){return st[x.id]}).length+"/"+T.length;
  var un=Ta.filter(function(x){return !st[x.id]}),sn=slotNow(),n=un.filter(function(x){return x.c===sn})[0]||un[0];
  document.getElementById("nx").innerHTML=n?'<i></i>'+esc(n.t):'Xong hết. Uống nước đi.';
  document.getElementById("ns").textContent=n?(n.d||""):"Nghỉ đi.";
}
function fd(n){return n===0?"hôm nay":(n===1?"ngày mai":n+" ngày")}
function eomN(){var d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),t=new Date(d.getFullYear(),d.getMonth(),29);if(d.getDate()>29)t=new Date(d.getFullYear(),d.getMonth()+1,29);return Math.round((t-a)/864e5)}
function dlRow(x){var n=x.n;return'<div class="dl'+(n<=1?' hot':(n<=7?' wk':' far'))+'"><span>'+dotH(x.a)+esc(x.t)+'</span><b class="mono">'+fd(n)+'</b></div>'}
function renderCompany(){
  var c=DATA.company,el=document.getElementById("co");if(!el)return;
  if(FAM||!c){el.innerHTML="";return}
  el.innerHTML='<div class="co"><div class="sl">'+esc(c.slogan||"")+'</div><div class="cg"><div><h2 class="lab mono">Nhân viên</h2>'+(c.staff||[]).map(function(s){return'<div class="stf"><b>'+esc(s.r)+'</b><span>'+esc(s.m)+'</span></div>'}).join("")+'</div><div><h2 class="lab mono">Nội quy</h2><div class="rul">'+(c.rules||[]).map(function(r){return'<div>'+esc(r)+'</div>'}).join("")+'</div></div></div></div>';
}
/* thời tiết: Open-Meteo (không cần khoá). Vị trí chỉ lưu trên trình duyệt (wb_loc), làm tròn ~10 km, không ghi vào repo. */
var WXD=["CN","T2","T3","T4","T5","T6","T7"];
var WXC='<path class="cl" d="M7 15h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 6.6 4.2 4.2 0 0 0 7 15z"/>';
function wxKind(c){return c<=1?"sun":c<=3?"cloud":(c===45||c===48)?"fog":(c>=71&&c<=77)||c===85||c===86?"snow":c>=95?"storm":"rain"}
function wxName(c){return{sun:"Nắng",cloud:"Mây",fog:"Sương mù",snow:"Tuyết",storm:"Dông",rain:"Mưa"}[wxKind(c)]}
function wxIc(c){var k=wxKind(c),b="";
  if(k==="sun")b='<circle cx="12" cy="12" r="4"/><path class="rays" d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  else if(k==="cloud")b='<path class="cl" d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/>';
  else if(k==="fog")b='<path class="cl" d="M4 8h16M6 12h12M4 16h16"/>';
  else if(k==="snow")b=WXC+'<path class="dr dr1" d="M8 18h.01M16 18h.01M10 21h.01"/><path class="dr dr2" d="M12 19h.01M14 21h.01"/>';
  else if(k==="storm")b=WXC+'<path class="bolt" d="M12 15l-2 3h3l-2 3"/>';
  else b=WXC+'<path class="dr dr1" d="M8 18l-1 2"/><path class="dr dr2" d="M12 18l-1 2"/><path class="dr dr3" d="M16 18l-1 2"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+b+'</svg>'}
function wxAsk(el,msg){
  el.innerHTML='<h2 class="lab mono">Thời tiết 7 ngày</h2><button class="more mono" id="wxb">Cho phép vị trí</button>'+(msg?'<div class="nt">'+msg+'</div>':'');
